<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Carrinho</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0066CC}a:hover{color:#004C99}
.press{transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
.press:active{transform:scale(0.97)}
button{font:inherit;cursor:pointer}
input{font:inherit}
@media (prefers-reduced-motion: reduce){.slide{transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, sans-serif;">

  <div aria-hidden="true" style="position: absolute; left: 14px; right: 14px; top: 46px; height: 120px; border-radius: 22px 22px 0 0; background: {{t.bg}}; opacity: 0.55;"></div>

  <section aria-label="Seu pedido" style="position: absolute; left: 0; right: 0; top: 58px; bottom: 0; border-radius: 22px 22px 0 0; background: {{t.bg}}; display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(0,0,0,0.25);">
    <div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 999px; margin: 8px auto 0 auto; background: {{t.grabber}};"></div>

    <div style="padding: 14px 20px 8px 20px; display: flex; align-items: center; justify-content: space-between;">
      <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em;">Seu pedido</h1>
      <a href="Main.dc.html" aria-label="Fechar" class="press" style="width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: {{t.fill}}; color: {{t.sub}};">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="padding: 8px 16px 0 16px; display: flex; flex-direction: column; gap: 22px;">

      <div style="border-radius: 18px; background: {{t.card}}; display: flex; flex-direction: column;">
        <sc-for list="{{itens}}" as="i" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: {{i.borda}};">
            <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 17px; font-weight: 600;">{{i.nome}}</span>
              <span style="font-size: 13px; color: {{t.sub}};">{{i.unitFmt}} cada</span>
            </div>
            <div style="display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: {{t.fill}};">
              <button class="press" onClick="{{i.menos}}" aria-label="Remover um {{i.nome}}" style="width: 32px; height: 32px; border: none; border-radius: 999px; background: {{t.card}}; color: {{t.text}}; font-size: 18px; font-weight: 600;">−</button>
              <span style="min-width: 18px; text-align: center; font-size: 15px; font-weight: 600;">{{i.qtd}}</span>
              <button class="press" onClick="{{i.mais}}" aria-label="Adicionar mais um {{i.nome}}" style="width: 32px; height: 32px; border: none; border-radius: 999px; background: {{t.card}}; color: {{t.text}}; font-size: 18px; font-weight: 600;">+</button>
            </div>
            <span style="min-width: 68px; text-align: right; font-size: 15px; font-weight: 600;">{{i.subFmt}}</span>
          </div>
        </sc-for>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="padding-left: 4px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; color: {{t.sub}};">Forma de pagamento</span>
        <div role="radiogroup" aria-label="Forma de pagamento" style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; border-radius: 999px; background: {{t.fill}};">
          <div aria-hidden="true" class="slide" style="position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 2); border-radius: 999px; background: {{t.on}}; box-shadow: 0 2px 8px rgba(0,0,0,0.12), 0 0 1px rgba(0,0,0,0.1); transform: translateX({{metodoX}}); transition: transform 380ms cubic-bezier(0.32,0.72,0,1);"></div>
          <sc-for list="{{metodos}}" as="m" hint-placeholder-count="2">
            <button role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="position: relative; min-height: 40px; border: none; border-radius: 999px; background: transparent; font-size: 15px; font-weight: {{m.peso}}; color: {{t.text}};">{{m.label}}</button>
          </sc-for>
        </div>
        <sc-if value="{{cartao}}" hint-placeholder-val="{{false}}">
          <div style="margin-top: 6px; border-radius: 14px; background: {{t.card}}; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px;">
            <label for="numero-cartao" style="font-size: 13px; color: {{t.sub}};">Número do cartão</label>
            <input id="numero-cartao" inputmode="numeric" placeholder="0000 0000 0000 0000" style="border: none; outline: none; padding: 4px 0; font-size: 17px; background: transparent; color: {{t.text}};">
          </div>
          <span style="padding-left: 4px; font-size: 13px; color: {{t.sub}};">Guardamos só os 4 últimos dígitos.</span>
        </sc-if>
        <sc-if value="{{pix}}" hint-placeholder-val="{{true}}">
          <span style="padding-left: 4px; font-size: 13px; color: {{t.sub}};">O código PIX aparece depois de confirmar.</span>
        </sc-if>
      </div>
    </div>

    <div style="margin-top: auto; padding: 14px 16px 34px 16px; display: flex; flex-direction: column; gap: 12px; border-top: 0.5px solid {{t.sep}}; background: {{t.bar}}; backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span style="font-size: 15px; color: {{t.sub}};">Total · retirar no balcão</span>
        <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em;">{{totalFmt}}</span>
      </div>
      <a href="Pedido.dc.html" class="press" style="min-height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 17px; font-weight: 600; background: {{accent}}; color: {{onAccent}};">Confirmar pedido</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["Verde","Laranja","Azul"],"default":"Azul"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { metodo: 'PIX', qtd: { 1: 2, 4: 1 } };
  }
  renderVals() {
    var dark = this.props.dark ?? false;
    var nomeCor = this.props.accent ?? 'Azul';
    var cores = { Verde: ['#1F7A35', '#30D158'], Laranja: ['#C93400', '#FF9F0A'], Azul: ['#0066CC', '#0A84FF'] };
    var par = cores[nomeCor] || cores.Azul;
    var accent = dark ? par[1] : par[0];
    var t = dark
      ? { bg: '#1C1C1E', card: '#2C2C2E', text: '#F5F5F7', sub: '#A1A1A6', fill: '#3A3A3C', bar: 'rgba(28,28,30,0.8)', sep: 'rgba(84,84,88,0.65)', grabber: '#5A5A5E', on: '#636366' }
      : { bg: '#F2F2F7', card: '#FFFFFF', text: '#1C1C1E', sub: '#6E6E73', fill: '#E3E3E8', bar: 'rgba(242,242,247,0.85)', sep: 'rgba(60,60,67,0.2)', grabber: '#C7C7CC', on: '#FFFFFF' };
    var self = this;
    var produtos = [
      { id: 1, nome: 'Coxinha de frango', preco: 6.5 },
      { id: 4, nome: 'Suco de laranja', preco: 4 }
    ];
    function brl(v) { return 'R$ ' + v.toFixed(2).replace('.', ','); }
    function mudar(id, delta) {
      var q = Object.assign({}, self.state.qtd);
      q[id] = Math.max(1, (q[id] || 0) + delta);
      self.setState({ qtd: q });
    }
    var total = 0;
    var itens = produtos.map(function (p, idx) {
      var q = self.state.qtd[p.id] || 1;
      total += q * p.preco;
      return {
        nome: p.nome, qtd: q, unitFmt: brl(p.preco), subFmt: brl(q * p.preco),
        borda: idx < produtos.length - 1 ? '0.5px solid ' + t.sep : 'none',
        mais: function () { mudar(p.id, 1); }, menos: function () { mudar(p.id, -1); }
      };
    });
    var metodo = this.state.metodo;
    var nomesMetodo = ['PIX', 'Cartão'];
    var metodos = nomesMetodo.map(function (m) {
      var on = m === metodo;
      return {
        label: m, on: on ? 'true' : 'false', peso: on ? 600 : 500,
        pick: function () { self.setState({ metodo: m }); }
      };
    });
    var metodoX = (nomesMetodo.indexOf(metodo) * 100) + '%';
    return {
      t: t, accent: accent, onAccent: dark ? '#000000' : '#FFFFFF',
      itens: itens, metodos: metodos, metodoX: metodoX, pix: metodo === 'PIX', cartao: metodo === 'Cartão', totalFmt: brl(total)
    };
  }
}
</script>
</body>
</html>
